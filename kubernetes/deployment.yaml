apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos
  labels:
    app: lifeos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lifeos
  template:
    metadata:
      labels:
        app: lifeos
    spec: 
      containers:
      - name:  lifeos
        image: lifeos: latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: lifeos-secrets
              key: database-host
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe: 
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5