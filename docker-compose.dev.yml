version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name:  lifeos-postgres-dev
    environment:
      POSTGRES_DB: lifeos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: 
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lifeos-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data: